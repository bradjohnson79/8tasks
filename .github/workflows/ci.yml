# Copy to .github/workflows/ci.yml (GitHub requires the "workflows" permission to add it; do it from github.com or your machine).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Database integration tests skip themselves when no local database is configured.
      - run: npm test
      - run: npm run build
        env:
          # Build-time placeholders only; no secrets. Pages that need the DB render at request time.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          ADMIN_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-000
          BETTER_AUTH_URL: http://localhost:3000
